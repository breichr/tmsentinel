name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Standard library only; cross-compilation needs no cgo.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Verify tag matches cli.Version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "const Version = \"$tag\"" cli/cli.go || {
            echo "tag v$tag does not match cli.Version" >&2; exit 1
          }
      - name: Build darwin/arm64
        run: go build -trimpath -ldflags "-s -w" -o "dist/tmsentinel" .
        env:
          GOARCH: arm64
      - name: Package darwin/arm64
        run: tar czf "tmsentinel-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" -C dist tmsentinel
      - name: Build darwin/amd64
        run: go build -trimpath -ldflags "-s -w" -o "dist/tmsentinel" .
        env:
          GOARCH: amd64
      - name: Package darwin/amd64
        run: tar czf "tmsentinel-${GITHUB_REF_NAME}-darwin-amd64.tar.gz" -C dist tmsentinel
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tmsentinel-*.tar.gz --generate-notes --title "tmsentinel ${GITHUB_REF_NAME}"
